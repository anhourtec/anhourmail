# Thin on purpose: every step calls a script in .cicd/ so the same checks run locally and in CI.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  checks:
    name: lint, format, types, repo checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/setup.sh
      - run: .cicd/checks.sh

  unit:
    name: unit tests + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/setup.sh
      - run: .cicd/unit.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage/, if-no-files-found: ignore }

  integration:
    name: integration (Postgres, Redis, Stalwart, Mailpit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/setup.sh
      - run: .cicd/integration.sh
      - if: failure()
        run: docker compose --profile ci logs --no-color --tail 300

  rbac:
    name: RBAC harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/setup.sh
      - run: .cicd/rbac.sh

  build:
    name: build apps + images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/setup.sh
      - run: .cicd/build.sh

  security:
    name: secret scan + dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/security.sh

  licences:
    name: licences, notices, SPDX
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: .cicd/setup.sh
      - run: .cicd/licences.sh
